<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Result - CURRENCY AUTHENTICATION SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-shield-alt"></i>
                CURRENCY AUTHENTICATION SYSTEM
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-outline-light">
                <i class="fas fa-home me-2"></i>
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Result Section -->
    <section class="result-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Result Banner -->
                    <div class="result-banner {% if prediction == 'REAL' %}genuine{% else %}fake{% endif %}">
                        {% if prediction == 'REAL' %}
                            <i class="fas fa-shield-check result-icon"></i>
                            <h2>GENUINE NOTE</h2>
                        {% else %}
                            <i class="fas fa-exclamation-triangle result-icon"></i>
                            <h2>FAKE NOTE DETECTED</h2>
                        {% endif %}
                    </div>

                    <!-- Currency Info -->
                    <div class="currency-info-section">
                        <div class="currency-display">
                            <span class="currency-flag">{{ currency_flag }}</span>
                            <span class="currency-text">Analyzing: {{ currency_name }} ({{ currency_code }})</span>
                        </div>
                    </div>

                    <!-- Uploaded Image -->
                    <div class="image-preview">
                        <img src="{{ url_for('static', filename='uploads/' + image_path) }}"
                             alt="Uploaded Currency" class="img-fluid">
                    </div>

                    <!-- Confidence Section -->
                    <div class="confidence-section">
                        <h3 class="confidence-title">CONFIDENCE LEVEL</h3>
                        <div class="progress-container">
                            <div class="progress-bar-custom">
                                <div class="progress-fill" style="width: {{ confidence }}%"></div>
                            </div>
                            <div class="confidence-percentage">
                                {{ "%.1f"|format(confidence) }}%
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <a href="{{ url_for('index') }}" class="btn-scan-again">
                            <i class="fas fa-redo me-2"></i>
                            SCAN AGAIN
                        </a>
                        <a href="{{ url_for('index') }}" class="btn-home">
                            <i class="fas fa-upload me-2"></i>
                            UPLOAD NEW
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script>
        // Animate progress bar on page load
        document.addEventListener('DOMContentLoaded', function() {
            const progressFill = document.querySelector('.progress-fill');
            const confidence = {{ confidence }};

            // Reset width to 0 for animation
            progressFill.style.width = '0%';

            // Animate to actual confidence
            setTimeout(() => {
                progressFill.style.width = confidence + '%';
            }, 500);
        });
    </script>
</body>
</html>
